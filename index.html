<!doctype html>
<html lang="ar" dir="rtl">
  <head>0000
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>خدمات الرياض - داتا حقيقية</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="menuBtn">☰</button>
    <div id="map"></div>

    <div id="panel" class="panel">
      <h3>🗺️ خدمات الرياض</h3>
      <p id="loading">جاري تحميل الداتا الحقيقية...</p>

      <label>نوع الخدمة</label>
      <select id="serviceType">
        <option value="all">الكل</option>
        <option value="hospital">🏥 مستشفيات</option>
        <option value="school">🏫 مدارس</option>
        <option value="pharmacy">💊 صيدليات</option>
        <option value="mosque">🕌 مساجد</option>
      </select>

      <label>بحث بالاسم</label>
      <input id="searchInput" placeholder="اكتب مثلا: الحبيب / الدواء" />
      <div id="searchResults"></div>
      <p id="serviceCount"></p>

      <hr />
      <label>مسافة Buffer بالمتر</label>
      <input id="bufferDist" type="number" value="500" />
      <button id="bufferBtn">عمل Buffer لآخر شكل</button>

      <hr />
      <button id="locationBtn">📍 حط لوكيشن على الخريطة</button>
      <button id="gpsBtn">📌 مكاني الحالي GPS</button>
      <button id="nearestBtn">🎯 اقرب 3 خدمات  </button>
      <button id="routeBtn">🛣️ أقصر طريق</button>
      <div id="nearestResult"></div>
      <div id="routeResult"></div>

      <hr />
      <button id="coverageBtn">🟢 عرض التغطية</button>
      <button id="exportBtn">⬇️ تصدير الرسم</button>
      <button id="clearBtn" class="danger">🗑️ مسح الكل</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
